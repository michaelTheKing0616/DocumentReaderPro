# Builds a installable Android APK for ReadAssist Pro (Document Reader).
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN          — Expo access token (https://expo.dev/accounts/[account]/settings/access-tokens)
#   EAS_PROJECT_ID      — From `eas init` / Expo project dashboard (optional if set in app.config.js)
#   EAS_PROJECT_OWNER   — Expo org/account slug (e.g. michaelthekings-organization); must match project owner
#
# Optional secrets for signed local/EAS release builds:
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Optional build-time env (Repository variables or Secrets):
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#   EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   (see .env.example for full list)

name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_method:
        description: Build method
        required: true
        default: eas
        type: choice
        options:
          - eas
          - local-debug
          - local-release
      profile:
        description: EAS profile (eas method only)
        required: false
        default: preview-apk
        type: choice
        options:
          - preview-apk
          - preview
          - production-apk
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --coverage=false

  build-eas:
    name: Build APK (EAS Cloud)
    needs: validate
    if: >
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_method == 'eas')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EAS_PROJECT_OWNER: ${{ vars.EAS_PROJECT_OWNER || secrets.EAS_PROJECT_OWNER || 'michaelthekings-organization' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SYNC_ENABLED: ${{ vars.EXPO_PUBLIC_SYNC_ENABLED || 'true' }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_STRIPE_PRICE_ID: ${{ vars.EXPO_PUBLIC_STRIPE_PRICE_ID || secrets.EXPO_PUBLIC_STRIPE_PRICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret. Create one at https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Verify Expo account and project owner
        run: |
          echo "Logged-in Expo account:"
          eas whoami
          echo "Configured owner: ${EAS_PROJECT_OWNER:-<not set>}"
          echo "Configured projectId: ${EAS_PROJECT_ID:-<from app.json/extra.eas.projectId>}"

      - name: Resolve EAS profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview-apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK on EAS
        id: eas_build
        run: |
          set +e
          PROFILE="${{ steps.profile.outputs.name }}"
          echo "Using EAS profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json > build-output.json
          BUILD_EXIT=$?
          cat build-output.json
          node <<'NODE'
          const fs = require('fs');
          let payload = {};
          try {
            payload = JSON.parse(fs.readFileSync('build-output.json', 'utf8'));
          } catch (error) {
            console.error('Could not parse build-output.json', error);
            process.exit(0);
          }
          const build = Array.isArray(payload) ? payload[0] : payload;
          if (!build) {
            process.exit(0);
          }
          console.log('EAS build id:', build.id ?? 'unknown');
          console.log('EAS build status:', build.status ?? 'unknown');
          if (build.error?.message) {
            console.error('EAS build error:', build.error.message);
          }
          if (build.logFiles?.length) {
            console.log('EAS log files:', build.logFiles.join(', '));
          }
          NODE
          if [ "$BUILD_EXIT" -ne 0 ]; then
            BUILD_ID=$(node -e "try{const r=require('./build-output.json');const b=Array.isArray(r)?r[0]:r;console.log(b?.id||'');}catch(e){console.log('');}")
            if [ -n "$BUILD_ID" ]; then
              echo "Fetching EAS build details for $BUILD_ID..."
              eas build:view "$BUILD_ID" --json || true
            fi
            echo "::error::EAS remote build failed. Open the build URL in the Expo dashboard for Gradle logs."
            exit "$BUILD_EXIT"
          fi
          BUILD_URL=$(node -e "const r=require('./build-output.json'); const b=Array.isArray(r)?r[0]:r; console.log(b?.artifacts?.buildUrl||'');")
          if [ -z "$BUILD_URL" ]; then
            echo "::error::EAS build finished but no artifact URL was returned."
            exit 1
          fi
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        run: |
          curl -L --fail "${{ steps.eas_build.outputs.build_url }}" -o ReadAssist-Pro-eas.apk
          ls -lh ReadAssist-Pro-eas.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: readassist-pro-eas-apk-${{ github.sha }}
          path: ReadAssist-Pro-eas.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReadAssist-Pro-eas.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-local:
    name: Build APK (Local Gradle)
    needs: validate
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_method == 'local-debug' || github.event.inputs.build_method == 'local-release'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SYNC_ENABLED: ${{ vars.EXPO_PUBLIC_SYNC_ENABLED || 'true' }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Decode release keystore
        if: github.event.inputs.build_method == 'local-release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — release build may use debug signing."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<EOF
          READASSIST_RELEASE_STORE_FILE=release.keystore
          READASSIST_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          READASSIST_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          READASSIST_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build debug APK
        if: github.event_name == 'pull_request' || github.event.inputs.build_method == 'local-debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Build release APK
        if: github.event.inputs.build_method == 'local-release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -x lint -x test

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || github.event.inputs.build_method == 'local-debug'
        uses: actions/upload-artifact@v4
        with:
          name: readassist-pro-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release APK
        if: github.event.inputs.build_method == 'local-release'
        uses: actions/upload-artifact@v4
        with:
          name: readassist-pro-release-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
