# Deploy Supabase migrations + Edge Functions (backend).
# Run manually or on push to main when backend files change.
#
# Required secrets:
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — Project ref from dashboard URL (e.g. abcdefghijklmnop)
#
# Set function secrets in Supabase dashboard or via CLI:
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, HF_API_KEY, etc.

name: Supabase Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'

jobs:
  deploy:
    name: Deploy Supabase
    runs-on: ubuntu-latest
    if: github.repository != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Skipping deploy — SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF not configured."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          supabase db push

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          for fn in stripe-checkout stripe-webhook stripe-portal hf-quiz evernote-create-note; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "Deploying $fn..."
              supabase functions deploy "$fn" --no-verify-jwt
            fi
          done
